name: Compilar Leandro Farm Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Baixar Godot 4.6
        run: |
          wget -q \
          https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip \
          -O godot.zip

          unzip -q godot.zip -d godot

          mv godot/Godot_v4.6-stable_linux.x86_64 godot/godot
          chmod +x godot/godot

          ./godot/godot --version

      - name: Instalar templates Godot 4.6
        run: |
          wget -q \
          https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz \
          -O templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.6.stable

          unzip -q templates.tpz -d templates

          cp -r templates/templates/* \
          ~/.local/share/godot/export_templates/4.6.stable/

          echo "Templates instalados:"
          ls -la ~/.local/share/godot/export_templates/4.6.stable/

      - name: Verificar projeto
        run: |
          echo "Projeto:"
          grep 'config/name=' project.godot || true

          echo "Versao:"
          grep 'config/features=' project.godot || true

          echo "Addons:"
          find addons -maxdepth 2 -type f | head -50 || true

      - name: Importar projeto
        run: |
          ./godot/godot \
          --headless \
          --editor \
          --path . \
          --quit-after 30 || true

      - name: Criar preset Android temporario
        run: |
          cat >> export_presets.cfg <<'EOF'

          [preset.3]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Leandro-Farm.apk"
          patches=PackedStringArray()
          patch_delta_encoding=false
          patch_delta_compression_level_zstd=19
          patch_delta_min_reduction=0.1
          patch_delta_include_filters="*"
          patch_delta_exclude_filters=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.3.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=true

          package/unique_name="com.leandro.farm"
          package/name="Leandro Farm"
          package/signed=true

          version/code=1
          version/name="0.1"

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          texture_format/etc2_astc=true
          texture_format/s3tc_bptc=false

          permissions/internet=false
          EOF

      - name: Mostrar preset Android
        run: |
          tail -80 export_presets.cfg

      - name: Criar pasta build
        run: |
          mkdir -p build

      - name: Exportar APK
        run: |
          ./godot/godot \
          --headless \
          --path . \
          --export-debug "Android" \
          build/Leandro-Farm.apk

      - name: Verificar APK
        run: |
          echo "Arquivos gerados:"
          ls -lh build/

          test -f build/Leandro-Farm.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Leandro-Farm-Android
          path: build/Leandro-Farm.apk
          if-no-files-found: error
